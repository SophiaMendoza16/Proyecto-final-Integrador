<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyDearLibrary</title>

    <!-- Hoja de estilos -->
 <link rel="stylesheet" href="MyDearLibraryV3.css">
</head>

<body>

    <!-- ==========================================
         Inicio de sesión   
    =========================================== -->

    <section id="login" class="pantalla">

        <div class="login-contenedor">

            <h1>📚 MyDearLibrary</h1>

            <p>Tu pequeña biblioteca personal</p>

            <form id="formularioLogin">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingresa tu usuario"
                >

                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                >

                <button type="submit">
                     Iniciar sesión
                </button>

            </form>

            <!-- Mensajes del inicio de sesión -->
            <p id="mensajeLogin"></p>

        </div>

    </section>


    <!-- ==========================================
         Sistema principal
    =========================================== -->

    <section id="sistema" class="oculto">

        <!-- ENCABEZADO -->

        <header>

            <h1> MyDearLibrary</h1>

            <p>Tu pequeña biblioteca personal</p>

        </header>


        <!-- ======================================
            Menú de navegación
        ======================================= -->

        <nav>

            <button onclick="mostrarMenu('inicio')">
                 Inicio
            </button>

            <button onclick="mostrarMenu('agregar')">
                 Agregar libro
            </button>

            <button onclick="mostrarMenu('libros')">
                 Mis libros
            </button>

            <button onclick="cerrarSesion()">
                 Cerrar sesión
            </button>

        </nav>


        <!-- ======================================
             Contenido principal
        ======================================= -->

        <main>

            <!-- =============== INICIO =============== -->

            <section id="inicio" class="seccion">

                <h2> Bienvenido a MyDearLibrary</h2>

                <p>
                    Aquí podrás registrar y consultar
                    los libros de tu biblioteca personal.
                </p>

                <div class="resumen">

                    <h3> Libros registrados</h3>

                    <p id="cantidadLibros">
                        0
                    </p>

                </div>

            </section>


            <!-- ============ Agregar libro ============ -->

            <section id="agregar" class="seccion oculto">

                <h2> Agregar libro</h2>

                <form id="formularioLibro">

                    <label for="titulo">
                        Título del libro
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ej: El Hobbit"
                    >


                    <label for="autor">
                        Autor
                    </label>

                    <input
                        type="text"
                        id="autor"
                        placeholder="Ej: J.R.R. Tolkien"
                    >


                    <label for="anio">
                        Año de publicación
                    </label>

                    <input
                        type="number"
                        id="anio"
                        placeholder="Ej: 1937"
                    >


                    <button type="submit">
                         Guardar libro
                    </button>

                </form>

                <!-- Mensaje del registro -->
                <p id="mensajeLibro"></p>

            </section>


            <!-- ============== Mis libros ============== -->

            <section id="libros" class="seccion oculto">

                <h2> Mis libros</h2>

                <div id="listaLibros">

                    <p>
                        Todavía no hay libros registrados.
                    </p>

                </div>

            </section>

        </main>

    </section>


    <!-- ==========================================
         Javascript
    =========================================== -->

    <script src="MyDearLibrary.js"></script>

</body>

</html>
